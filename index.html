<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1e2a5a" />
    <meta
      name="description"
      content="Passerelle — курс французької мови для українців. Від A0 до B2: озвучка, інтервальні повторення, розмовна практика, інтерактивні тексти."
    />
    <title>Passerelle — французька українською</title>
    <script>
      // Apply the stored theme before first paint to avoid a flash.
      try {
        const raw = localStorage.getItem('passerelle:settings')
        const theme = raw ? JSON.parse(raw)?.state?.theme : 'system'
        const dark =
          theme === 'dark' ||
          ((!theme || theme === 'system') &&
            window.matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.classList.toggle('dark', dark)
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
